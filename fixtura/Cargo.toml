[package]
name = "fixtura"
version = "0.4.0"
edition = "2021"
description = "Declarative fake data injection for Rust tests. Built on fake-rs."
license = "MIT"
repository = "https://github.com/dsalazar4/fixtura"
readme = "../README.md"
keywords = ["testing", "fake", "fixtures", "macros", "dummy"]
categories = ["development-tools::testing"]

[dependencies]
fixtura-macros = { path = "../fixtura-macros", version = "0.4.0" }

[dev-dependencies]
fake = { version = "5", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }
trybuild = "1"
