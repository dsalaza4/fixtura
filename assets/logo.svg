<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <!-- Background -->
  <rect width="480" height="160" rx="14" fill="#0F172A"/>

  <!-- Grid: 4×4 dots representing struct fields -->
  <!-- x: 36, 68, 100, 132  |  y: 28, 60, 92, 124 -->

  <!-- Row 1 -->
  <circle cx="36"  cy="28"  r="5.5" fill="#334155"/>
  <circle cx="68"  cy="28"  r="5.5" fill="#334155"/>
  <circle cx="100" cy="28"  r="5.5" fill="#334155"/>
  <circle cx="132" cy="28"  r="5.5" fill="#334155"/>

  <!-- Row 2 — one field is pinned -->
  <circle cx="36"  cy="60"  r="5.5" fill="#334155"/>
  <circle cx="68"  cy="60"  r="18"  fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.3"/>
  <circle cx="68"  cy="60"  r="11"  fill="#F97316"/>
  <circle cx="100" cy="60"  r="5.5" fill="#334155"/>
  <circle cx="132" cy="60"  r="5.5" fill="#334155"/>

  <!-- Row 3 -->
  <circle cx="36"  cy="92"  r="5.5" fill="#334155"/>
  <circle cx="68"  cy="92"  r="5.5" fill="#334155"/>
  <circle cx="100" cy="92"  r="5.5" fill="#334155"/>
  <circle cx="132" cy="92"  r="5.5" fill="#334155"/>

  <!-- Row 4 -->
  <circle cx="36"  cy="124" r="5.5" fill="#334155"/>
  <circle cx="68"  cy="124" r="5.5" fill="#334155"/>
  <circle cx="100" cy="124" r="5.5" fill="#334155"/>
  <circle cx="132" cy="124" r="5.5" fill="#334155"/>

  <!-- Wordmark -->
  <text x="164" y="99"
        font-family="'Courier New', Courier, monospace"
        font-size="54"
        font-weight="700"
        fill="#F8FAFC"
        letter-spacing="-1">fixtura</text>
</svg>
