[package]
name = "fixtura-macros"
version = "0.8.5"
edition = "2024"
rust-version = "1.85"
description = "Proc-macro internals for fixtura — do not depend on this crate directly"
license = "MIT"
repository = "https://github.com/dsalaza4/fixtura"
readme = "README.md"
keywords = ["testing", "fake", "fixtures", "macros"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
syn  = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
fake = { version = "5", features = ["derive"] }
